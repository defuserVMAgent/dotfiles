# Prefix: Alt+Space
unbind C-b
set -g prefix M-Space
bind M-Space send-prefix

# True color
set-option -g default-terminal 'screen-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'

# Quality of life
set -g mouse on
set -g base-index 1              # start indexing windows at 1 instead of 0
setw -g pane-base-index 1        # same for panes
set -g renumber-windows on       # renumber windows when one is closed
set -g escape-time 0             # zero-out escape time delay (snappier vim)
set -g focus-events on           # forward focus events to apps (nvim autoread)
set -g history-limit 100000      # bigger scrollback
set -g set-clipboard on          # use system clipboard
set -g status-position top       # status bar at top
setw -g mode-keys vi             # vi-style copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"

# Pane borders — thick + bright on active, faded on inactive
set -g pane-border-lines single
set -g pane-active-border-style 'fg=#ff9e64'
set -g pane-border-style 'fg=#16161e'
set -g pane-border-indicators both
set -g pane-border-status top
set -g pane-border-format ''

# Status bar — dotbar style (minimal, transparent)
set -g status-style 'bg=default,fg=#565b66'
set -g status-justify left
set -g status-left-length 50
set -g status-right-length 100

set -g status-left ''
# Right side: Claude usage (5h + weekly, harvested by ~/.claude/statusline.sh,
# rendered by ~/.local/bin/tmux-claude-usage), session name, prefix indicator
# (lights up when prefix is active)
set -g status-right '#(~/.local/bin/tmux-claude-usage)  #[fg=#565b66]#S #[fg=#7aa2f7]#{?client_prefix,● ,○ }'

set -g window-status-separator ''
# No fg= pin here: Claude Code hooks (~/.claude/settings.json) recolor inactive
# tabs via window-status-style — orange #ff9e64 = working, red #f7768e = wants
# input, cleared on Stop. A pinned fg would override the hook's black text.
set -g window-status-format ' #I #W '
set -g window-status-current-format '#[bg=#7aa2f7,fg=#1a1b26,bold] #I #W '

# Visiting a window acknowledges a red "Claude wants input" tab (set by the
# Notification hook in ~/.claude/settings.json) and clears it. Orange
# (working) is left alone — only red is focus-clearable. Keep the hex here
# paired with the Notification hook color.
set-hook -g after-select-window 'if -F "#{m:*f7768e*,#{window-status-style}}" "set -uw window-status-style"'

# Smart pane switching with awareness of Vim splits
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Open new splits/windows in the current pane's directory
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"

# Kill pane / window without confirmation prompt
bind x kill-pane
bind & kill-window

# Open current pane's contents (incl. scrollback) in nvim in a new window
bind ] run-shell '~/.local/bin/tmux-capture-to-nvim "#{pane_id}"'
